services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      AIAUTH_HOST: "0.0.0.0"
      AIAUTH_PORT: "8000"
      AIAUTH_ENVIRONMENT: "prod"
      AIAUTH_LOG_LEVEL: "INFO"
      AIAUTH_CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
