[project]
name = "ai-image-authenticator"
version = "1.0.0"
description = "Local multi-signal forensic detector for AI-generated images"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "piexif>=1.1.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "pywavelets>=1.10.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
c2pa = [
    "c2pa-python>=0.6.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[project.scripts]
ai-auth = "ai_image_authenticator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/ai_image_authenticator"]

[tool.hatch.build.targets.wheel.sources]
"apps/api/src" = ""

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is intentional
    "E501",   # forensic strings / signatures often exceed 100
    "UP042",  # keep Verdict as str, Enum for JSON compatibility
]

[tool.uv]
package = true
default-groups = ["dev"]
